# 塔筒参数配置(默认:80 m 三段锥形塔)
# 严禁在代码中硬编码塔筒尺寸;更换塔筒只改本文件。
tower:
  total_height: 80.0        # 塔筒总高 m
  bottom_diameter: 4.2      # 底部直径 m
  top_diameter: 2.6         # 顶部直径 m
  segments:                 # 锥形分段,必须连续覆盖 0 ~ total_height
    - start_height: 0.0
      end_height: 30.0
      bottom_diameter: 4.2
      top_diameter: 3.8
    - start_height: 30.0
      end_height: 60.0
      bottom_diameter: 3.8
      top_diameter: 3.1
    - start_height: 60.0
      end_height: 80.0
      bottom_diameter: 3.1
      top_diameter: 2.6
